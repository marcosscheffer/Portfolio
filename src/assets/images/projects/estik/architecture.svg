<svg xmlns="http://www.w3.org/2000/svg" width="960" height="680" viewBox="0 0 960 680">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#c2ef86" stroke-opacity=".045"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9fbf7c"/></marker>
  </defs>
  <rect width="960" height="680" fill="#1b2117"/>
  <rect width="960" height="680" fill="url(#grid)"/>
  <g font-family="Arial,sans-serif">
    <text x="60" y="66" fill="#a8bb98" font-size="15" letter-spacing="3">ESTIK V2 / ARQUITETURA DA API</text>
    <text x="60" y="120" fill="#eef4e8" font-size="34">Arquitetura hexagonal, módulo a módulo.</text>

    <!-- Client -->
    <rect x="60" y="292" width="150" height="88" rx="9" fill="#25331d" stroke="#68834e"/>
    <text x="135" y="330" fill="#e2eed6" font-size="18" text-anchor="middle">Cliente web</text>
    <text x="135" y="356" fill="#a7bc94" font-size="12" text-anchor="middle">HTTPS · JWT</text>

    <!-- Client <-> API -->
    <path d="M212 320H256" stroke="#9fbf7c" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="234" y="311" fill="#b6ca9e" font-size="11" text-anchor="middle">REST</text>
    <path d="M256 356H214" stroke="#9fbf7c" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
    <text x="234" y="374" fill="#b6ca9e" font-size="11" text-anchor="middle">SSE</text>
    <text x="135" y="412" fill="#7f9469" font-size="12" text-anchor="middle" letter-spacing="1">web-net</text>

    <!-- API container -->
    <rect x="260" y="160" width="440" height="430" rx="14" fill="#172012" stroke="#52653f" stroke-dasharray="7 7"/>
    <text x="282" y="194" fill="#b6ca9e" font-size="13" letter-spacing="2">SPRING BOOT 4 · JAVA 25</text>
    <g fill="#202b19" stroke="#4d6239">
      <rect x="282" y="210" width="128" height="28" rx="6"/><rect x="416" y="210" width="128" height="28" rx="6"/><rect x="550" y="210" width="128" height="28" rx="6"/>
      <rect x="282" y="244" width="128" height="28" rx="6"/><rect x="416" y="244" width="128" height="28" rx="6"/><rect x="550" y="244" width="128" height="28" rx="6"/>
    </g>
    <g fill="#d3e3c2" font-size="12" text-anchor="middle">
      <text x="346" y="228">Chamados</text><text x="480" y="228">Chat</text><text x="614" y="228">Notificações</text>
      <text x="346" y="262">Computadores</text><text x="480" y="262">Estoque</text><text x="614" y="262">Administração</text>
    </g>

    <g fill="#25331d" stroke="#68834e">
      <rect x="282" y="292" width="396" height="50" rx="8"/>
      <rect x="282" y="350" width="396" height="50" rx="8"/>
      <rect x="282" y="408" width="396" height="50" rx="8" fill="#2f4221" stroke="#8fb06a"/>
      <rect x="282" y="466" width="396" height="50" rx="8"/>
    </g>
    <g font-family="Consolas,'Courier New',monospace" font-size="14" fill="#c2ef86">
      <text x="300" y="322">adapter/in</text><text x="300" y="380">application</text><text x="300" y="438">domain</text><text x="300" y="496">adapter/out</text>
    </g>
    <g fill="#d3e3c2" font-size="13" text-anchor="end">
      <text x="660" y="322">Controllers REST · SSE · listeners</text>
      <text x="660" y="380">Casos de uso · portas de entrada e saída</text>
      <text x="660" y="438">Entidades e regras de negócio</text>
      <text x="660" y="496">JPA · JWT · arquivos com URL assinada</text>
    </g>
    <text x="480" y="552" fill="#a7bc94" font-size="12" text-anchor="middle">Módulos se comunicam só por portas e eventos publicados após o commit.</text>
    <text x="480" y="572" fill="#7f9469" font-size="11" text-anchor="middle">Spring Security · JWT com refresh token revogável · 3 perfis de acesso</text>

    <!-- API -> DB -->
    <path d="M702 336H746" stroke="#9fbf7c" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="724" y="326" fill="#7f9469" font-size="11" text-anchor="middle">db-net</text>

    <!-- Database -->
    <rect x="750" y="292" width="150" height="88" rx="9" fill="#25331d" stroke="#68834e"/>
    <text x="825" y="330" fill="#e2eed6" font-size="18" text-anchor="middle">PostgreSQL 17</text>
    <text x="825" y="356" fill="#a7bc94" font-size="12" text-anchor="middle">Migrações Flyway</text>

    <!-- Backup -->
    <path d="M825 382V436" stroke="#9fbf7c" stroke-width="2" stroke-dasharray="5 4"/>
    <rect x="750" y="438" width="150" height="78" rx="9" fill="#202b19" stroke="#4d6239"/>
    <text x="825" y="472" fill="#e2eed6" font-size="16" text-anchor="middle">Backup</text>
    <text x="825" y="496" fill="#a7bc94" font-size="12" text-anchor="middle">pg_dump agendado</text>

    <text x="480" y="626" fill="#7f9469" font-size="13" text-anchor="middle" letter-spacing="1">DOCKER COMPOSE · SWAGGER / OPENAPI · ACTUATOR</text>
    <circle cx="67" cy="652" r="4" fill="#c2ef86"/>
    <text x="83" y="657" fill="#a8bb98" font-size="14">Diagrama ilustrativo · Nenhum dado do ambiente interno</text>
  </g>
</svg>
